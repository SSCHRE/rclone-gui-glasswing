name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check electron/main.js
          node --check electron/preload.js
          node --check electron/mounts.js
          node --check src/renderer.js
          node --check src/job-output.js
          node --check src/remote-manager.js
          node --check src/remote-browser.js
          node --check src/transfer-panel.js
          node --check src/bandwidth-settings.js
          node --check src/job-schedule.js
          node --check electron/scheduler.js
          node --check scripts/generate-icons.js

      - name: Generate icons
        run: npm run icons

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run icons

      - name: Build Windows app
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR build: packaging unpacked app only (no publish/signing)"
            npx electron-builder --win dir --publish never
          else
            echo "Main build: portable + NSIS installers (no publish/signing)"
            npx electron-builder --win --publish never
          fi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glasswing-windows-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run icons

      - name: Build Linux app
        run: npx electron-builder --linux AppImage deb --publish never

      - name: Check Linux packages
        run: |
          ls -lh dist/*.AppImage dist/*.deb
          dpkg-deb --info dist/*.deb
          dpkg-deb --info dist/*.deb postinst | grep -q "chmod 4755"
          dpkg-deb --info dist/*.deb postinst | grep -q "apparmor_parser --replace"
          dpkg-deb --fsys-tarfile dist/*.deb | tar -xO ./usr/share/applications/glasswing.desktop | grep -x "StartupWMClass=rclone-glasswing-gui"
          dpkg-deb --contents dist/*.deb | grep -E "glasswing$|\.desktop$|icons/.*\.png$"
          chmod +x dist/*.AppImage
          (cd dist && ./*.AppImage --appimage-extract >/dev/null)
          test -x dist/squashfs-root/glasswing
          test -x dist/squashfs-root/resources/app.asar.unpacked/node_modules/7zip-bin/linux/x64/7za
          rm -rf dist/squashfs-root

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glasswing-linux-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 14
