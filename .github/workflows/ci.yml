name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in electron/*.js src/*.js scripts/*.js; do
            node --check "$file"
          done

      - name: Generate icons
        run: npm run icons

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate icons
        run: npm run icons

      - name: Build Windows app
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR build: packaging unpacked app only (no publish/signing)"
            npm run build:dir -- --publish never
          else
            echo "Main build: portable + NSIS installers (no publish/signing)"
            npm run build -- --publish never
          fi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: glasswing-windows-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate icons
        run: npm run icons

      - name: Build Linux app
        run: npm run build:linux -- --publish never

      - name: Check Linux packages
        run: |
          ls -lh dist/*.AppImage dist/*.deb
          dpkg-deb --info dist/*.deb
          # Write listings to files first: piping into `grep -q` exits early,
          # which makes dpkg-deb/tar fail with "write error" under pipefail.
          dpkg-deb --info dist/*.deb postinst > /tmp/postinst.txt
          grep -q "chmod 4755" /tmp/postinst.txt
          grep -q "apparmor_parser --replace" /tmp/postinst.txt
          dpkg-deb --fsys-tarfile dist/*.deb | tar -xO ./usr/share/applications/glasswing.desktop > /tmp/glasswing.desktop
          grep -x "StartupWMClass=rclone-glasswing-gui" /tmp/glasswing.desktop
          dpkg-deb --contents dist/*.deb > /tmp/deb-contents.txt
          grep -E "glasswing$|\.desktop$|icons/.*\.png$" /tmp/deb-contents.txt
          for size in 16 32 48 128 256 512; do grep -q "hicolor/${size}x${size}/apps/glasswing.png" /tmp/deb-contents.txt; done
          chmod +x dist/*.AppImage
          (cd dist && ./*.AppImage --appimage-extract >/dev/null)
          test -x dist/squashfs-root/glasswing || { echo "MISSING: glasswing binary"; exit 1; }
          test -x dist/squashfs-root/resources/app.asar.unpacked/node_modules/7zip-bin/linux/x64/7za || { echo "MISSING: 7za"; exit 1; }
          rm -rf dist/squashfs-root

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: glasswing-linux-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 14

  build-mac:
    name: Build macOS
    runs-on: macos-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate icons
        run: npm run icons

      - name: Build macOS app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR build: packaging unpacked app only (no dmg, no publish)"
            npx electron-builder --mac dir --arm64 --publish never
            exit 0
          fi
          for attempt in 1 2; do
            if npm run build:mac -- --publish never; then
              exit 0
            fi
            echo "macOS build failed (attempt $attempt), cleaning up mounted images and retrying"
            hdiutil info | awk '/\/dev\/disk/ && /Glasswing/ {print $1}' | xargs -I{} hdiutil detach {} -force || true
            rm -f dist/*.dmg dist/*.blockmap
          done
          exit 1

      - name: Check macOS packages
        if: github.event_name != 'pull_request'
        run: |
          ls -lh dist/*.dmg dist/*.zip dist/latest-mac.yml
          for arch in arm64 x64; do
            ls dist/*-"$arch".dmg dist/*-"$arch".zip
          done
          for app in dist/mac-arm64/Glasswing.app dist/mac/Glasswing.app; do
            test -d "$app" || { echo "MISSING: $app"; exit 1; }
            test -n "$(find "$app/Contents/Resources/app.asar.unpacked/node_modules/7zip-bin/mac" -name 7za -type f)" || { echo "MISSING: 7za in $app"; exit 1; }
          done
          grep -q "arm64.zip" dist/latest-mac.yml
          grep -q "x64.zip" dist/latest-mac.yml

      - name: Upload macOS artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: glasswing-mac-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-mac]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists, bump the version in package.json to make a new one."
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download builds
        if: steps.exists.outputs.found == 'false'
        uses: actions/download-artifact@v5
        with:
          pattern: glasswing-*-${{ github.sha }}
          path: artifacts
          merge-multiple: true

      - name: Create release
        if: steps.exists.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(artifacts/*.exe artifacts/*.AppImage artifacts/*.deb artifacts/*.dmg artifacts/*.zip artifacts/latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No build files found"; exit 1
          fi
          printf '%s\n' "${files[@]}"
          tag="${{ steps.version.outputs.tag }}"
          sed "s/VERSION/${tag#v}/g" .github/release-notes.md > release-notes.md
          gh release create "$tag" "${files[@]}" \
            --target "${{ github.sha }}" \
            --title "$tag" \
            --notes-file release-notes.md \
            --generate-notes
